<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>display.php サンプル画像</title>
<style>
/* ── ボタン点滅アニメーション ── */
@keyframes btn-blink {
    0%, 100% { background: #ffd700; box-shadow: 0 0 0 3px #ff4444, 0 0 12px 3px rgba(255,68,68,0.5); }
    50%       { background: #ff6600; color: #fff; box-shadow: 0 0 0 3px #ff4444, 0 0 20px 8px rgba(255,100,0,0.8); }
}
.btn-blink {
    animation: btn-blink 0.8s ease-in-out infinite;
}

/* ── モックアップ外枠（スマホ風） ── */
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    font-family: 'Arial', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
}

.phone-frame {
    width: 390px;
    min-height: 844px;
    background: #0d1b2a;
    border-radius: 40px;
    border: 10px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 0 2px #444;
    overflow: hidden;
    position: relative;
}

/* ── CSS変数 ── */
.phone-inner {
    --bg-main:    #0d1b2a;
    --bg-header:  #1b2a3b;
    --bg-calling: #3a2800;
    --bg-playing: #0f2d14;
    --bg-done:    #1a1a1a;
    --bg-empty:   #0a0a0a;
    --bd-calling: #f9a825;
    --bd-playing: #2e7d32;
    --bd-done:    #444;
    --text-main:  #ffffff;
    --text-dim:   #888;
    --text-clock: #90caf9;
    --score-t1:   #90caf9;
    --score-t2:   #a5d6a7;
    --sub-calling: #f9a825;
    --num-bg:     #1565c0;
    --num-fg:     #fff;
    --ticker-fg:  #90caf9;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    background: var(--bg-main);
    color: var(--text-main);
    height: 100%;
    min-height: 824px;
    padding: 6px;
    gap: 5px;
    box-sizing: border-box;
}

/* ── ヘッダー ── */
.header {
    display: flex;
    align-items: center;
    background: var(--bg-header);
    border-radius: 6px;
    padding: 5px 10px;
    gap: 8px;
    flex-shrink: 0;
}
.event-name {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-main);
    white-space: nowrap;
    flex-shrink: 0;
}
.ticker {
    flex: 1;
    font-size: 11px;
    color: var(--ticker-fg);
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
}
.current-time {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-clock);
    flex-shrink: 0;
}

/* ── コートグリッド（縦長：1列） ── */
.courts-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
}

/* ── コートカード ── */
.court-card {
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.court-card.status-calling {
    background: var(--bg-calling);
    border: 2.5px solid var(--bd-calling);
    box-shadow: 0 0 10px 3px rgba(249,168,37,0.3);
}
.court-card.status-playing {
    background: var(--bg-playing);
    border: 2px solid var(--bd-playing);
}
.court-card.status-done {
    background: var(--bg-done);
    border: 1.5px solid var(--bd-done);
    opacity: 0.55;
}

/* ── ヘッダー帯 ── */
.pc-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    flex-shrink: 0;
    min-height: 36px;
    position: relative;
}
.status-calling .pc-head { background: #f59f00; }
.status-playing .pc-head { background: #388e3c; }
.status-done    .pc-head { background: #666; }

/* コートバッジ */
.pc-badge {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,0.22);
    padding: 0 6px;
    border-radius: 4px;
    line-height: 1.3;
    flex-shrink: 0;
}

/* ステータスラベル */
.pc-status {
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    letter-spacing: 0.03em;
}

/* 主審スコア入力ボタン */
.pc-score-btn {
    font-size: 10px;
    font-weight: bold;
    background: #ffd700;
    color: #333;
    border-radius: 5px;
    padding: 4px 8px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.4;
    text-align: center;
    display: inline-block;
    border: none;
    cursor: pointer;
}
.pc-score-btn-playing {
    background: #1565c0;
    color: #fff;
}

/* ── ボディ ── */
.pc-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 10px 8px;
}

/* チーム1（左詰め） */
.pc-team1-block {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    align-items: center;
}

/* チーム2（右詰め） */
.pc-team2-block {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    align-items: center;
    justify-content: flex-end;
}

/* 選手名 */
.pc-player {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    white-space: nowrap;
    color: #fff;
}

/* 選手番号バッジ */
.pc-pnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--num-bg);
    color: var(--num-fg);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 10px;
    font-weight: 900;
    flex-shrink: 0;
    line-height: 1;
}

/* VS・スコア行 */
.pc-score-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto 1fr;
    align-items: center;
    gap: 4px;
    text-align: center;
}
.pc-vs-label {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    padding: 4px 0;
}
.pc-s1 {
    font-size: 30px;
    font-weight: 900;
    color: var(--score-t1);
    line-height: 1;
    text-align: right;
}
.pc-sv {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-dim);
}
.pc-s2 {
    font-size: 30px;
    font-weight: 900;
    color: var(--score-t2);
    line-height: 1;
    text-align: left;
}
.pc-balls {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex-wrap: wrap;
}
.pc-balls:first-child { justify-content: flex-end; }
.pc-balls:last-child  { justify-content: flex-start; }

/* バドミントンボール */
.ball-svg {
    display: inline-block;
    width: 12px;
    height: 12px;
}

/* ── 矢印＆吹き出しアノテーション ── */
.annotation-wrap {
    position: relative;
}

/* 矢印：ボタンの右側 */
.arrow-right {
    position: absolute;
    right: -46px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    z-index: 10;
}
.arrow-right .arrow-line {
    width: 24px;
    height: 3px;
    background: #ff4444;
}
.arrow-right .arrow-head {
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 14px solid #ff4444;
}

/* 吹き出し */
.speech-bubble {
    position: absolute;
    right: -175px;
    top: -52px;
    background: #fff;
    color: #d32f2f;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 10px;
    border-radius: 10px;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(0,0,0,0.5);
    line-height: 1.4;
    z-index: 20;
    border: 2px solid #ff4444;
}
/* 吹き出しの尾（三角） */
.speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 22px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #ff4444;
}
.speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 24px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid #fff;
    z-index: 1;
}

/* ← 左向き吹き出し（ボタン左上から出す版） */
.callout-box {
    position: absolute;
    left: -4px;
    bottom: 54px;
    background: #fff200;
    color: #b71c1c;
    font-size: 11.5px;
    font-weight: 900;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55);
    line-height: 1.4;
    z-index: 20;
    border: 2.5px solid #ff4444;
    letter-spacing: 0.02em;
}
.callout-box::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 18px;
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 14px solid #ff4444;
}
.callout-box::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 21px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 11px solid #fff200;
    z-index: 1;
}

/* ← 矢印（吹き出し → ボタン方向） */
.callout-arrow {
    position: absolute;
    right: -4px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    z-index: 15;
}
.callout-arrow .c-line {
    width: 18px;
    height: 3.5px;
    background: #ff4444;
    border-radius: 2px;
}
.callout-arrow .c-head {
    width: 0; height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 12px solid #ff4444;
}
</style>
</head>
