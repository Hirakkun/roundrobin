<!--
  コートスコア入力ページ
  URL: /score/court?session=XXXX&court=0
-->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>スコア入力</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ベースフォント：画面幅に追従（高齢者対応・大きめ設定） */
        html {
            font-size: clamp(20px, 5.8vw, 30px);
        }
        body {
            height: 100%; font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', Arial, sans-serif;
            background: #f4f4f9; font-size: 1rem;
        }

        /* ===== オーバーレイ（待機・接続中） ===== */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #1a237e; color: #fff;
            text-align: center; padding: 1.5em;
        }
        .overlay .ov-icon { font-size: 3.2em; margin-bottom: 0.7em; }
        .overlay .ov-msg  { font-size: 1.05em; font-weight: bold; line-height: 1.8; white-space: pre-line; }
        .overlay .ov-sub  { font-size: 0.75em; color: #9fa8da; margin-top: 0.6em; }
        .loading-dots { display: flex; gap: 0.4em; margin-top: 1em; justify-content: center; }
        .loading-dots span {
            width: 0.6em; height: 0.6em; background: #7986cb;
            border-radius: 50%; animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce {
            0%,80%,100% { transform: scale(.6); opacity: .4; }
            40%          { transform: scale(1);  opacity: 1;  }
        }

        /* ===== セットアップ画面（コート配置＋サーブを1画面で選択） ===== */
        .setup-screen {
            position: fixed; inset: 0; z-index: 40; background: #283593;
            display: none; flex-direction: column;
            align-items: stretch; justify-content: center;
            gap: 0.8em; padding: 1.2em 1em;
        }
        .setup-screen h2 {
            /* 説明文が長いため、スマホ幅で3行に割れて「サー／ブ」のような
               不自然な改行にならないよう控えめのサイズにする */
            color: #fff; font-size: 1.08em; text-align: center;
            font-weight: bold; line-height: 1.35;
        }
        .setup-screen .sub {
            color: #c5cae9; font-size: 0.82em;
            text-align: center; line-height: 1.6;
        }
        .setup-btn {
            width: 100%; padding: 1.1em 0.8em;
            border: none; border-radius: 0.65em;
            font-size: 1.1em; font-weight: bold; cursor: pointer;
            line-height: 1.5; text-align: center;
        }
        .setup-btn:active { opacity: .8; }
        .setup-btn.t1 { background: #1565c0; color: #fff; }
        .setup-btn.t2 { background: #2e7d32; color: #fff; }

        /* セットアップ画面・バッジの色調整 */
        .setup-btn .num-badge { background: rgba(255,255,255,0.9); color: #1565c0; }
        .setup-btn.t2 .num-badge { color: #2e7d32; }

        /* ===== コート図（配置＋サーブ選択を統合） ===== */
        .court-diagram {
            position: relative; width: 100%; max-width: 24em;
            align-self: center; padding-top: 1.1em;
        }
        /* 左右チーム入れ替えボタン（コート上辺の中央） */
        .swap-sides-btn {
            position: absolute; top: -0.2em; left: 50%;
            transform: translateX(-50%); z-index: 3;
            font-size: 1.7em; color: #e53935;
            background: #fff; border: none; border-radius: 1em;
            padding: 0 0.4em; cursor: pointer; line-height: 1.3;
            box-shadow: 0 1px 3px rgba(0,0,0,.45);
            touch-action: manipulation;
        }
        .swap-sides-btn:active { transform: translateX(-50%) scale(0.9); }
        .court-box {
            display: flex; border: 3px solid #fff; border-radius: 0.3em;
            min-height: 11em; background: rgba(255,255,255,0.08);
        }
        /* コートの左右半面＝チーム1組（半面自体はタップ対象ではない） */
        .court-half {
            flex: 1; min-width: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.3em;
            padding: 0.7em 0.2em; margin: 0.3em;
            border-radius: 0.5em;
        }
        .cd-name {
            color: #fff; font-weight: bold; font-size: 0.95em;
            text-align: center; width: 100%;
            line-height: 1.25;
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 0.2em;
        }
        /* デュース枠＝第1ゲームのサーバーが立つ位置。
           名前ごと「サーブ」ボタンにして、当たり判定を広く保ちつつ
           「ここに居る人が最初に打つ」という意味を明確にする */
        .cd-serve-slot {
            padding: 0.45em 0.15em;
            background: rgba(255,255,255,0.12);
            border: 2px dashed rgba(255,255,255,0.55);
            border-radius: 0.5em;
            cursor: pointer; touch-action: manipulation;
            transition: background .15s, border-color .15s;
        }
        .cd-serve-slot:active { opacity: .75; }
        /* 選択済み。半透明のアンバーは濃紺の下地と混ざって濁るので不透明にする */
        .cd-serve-slot.selected {
            background: #ffc107;
            border: 2px solid #ffca28;
            color: #1a237e;
        }
        .cd-serve-slot.selected .num-badge { background: #1a237e; color: #ffc107; }
        /* 枠内の「🎾 サーブ」ラベル（これがボタンであることを示す） */
        .cd-serve-label {
            flex-basis: 100%;
            font-size: 0.72em; font-weight: bold;
            letter-spacing: 0.08em; opacity: 0.9;
            margin-top: 0.15em;
        }
        .cd-net { width: 4px; background: #fff; flex-shrink: 0; }
        /* ペア内の並び替えボタン（サーブ枠のタップと競合しないよう stopPropagation する） */
        .swap-pair-btn {
            font-size: 1.4em; color: #43a047;
            background: #fff; border: none; border-radius: 1em;
            padding: 0 0.35em; cursor: pointer; line-height: 1.3;
            box-shadow: 0 1px 3px rgba(0,0,0,.45);
            touch-action: manipulation; margin: 0.35em 0;
        }
        .swap-pair-btn:active { transform: scale(0.9); }
        /* 未選択の間は開始できない */
        .setup-btn:disabled {
            background: #9e9e9e; color: rgba(255,255,255,0.6);
            cursor: not-allowed;
        }

        /* ===== コート情報バー ===== */
        .court-info-bar {
            background: #283593; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.35em 0.7em; font-size: 0.75em; font-weight: bold;
            flex-shrink: 0;
        }
        .court-info-bar .round-name { color: #9fa8da; }
        .court-info-bar .court-name { font-size: 1.1em; }
        .court-info-bar .games-badge {
            font-size: 0.85em; background: rgba(255,255,255,.2);
            padding: 0.15em 0.5em; border-radius: 1em;
        }

        /* ===== メイン画面 ===== */
        .container {
            /* html に height:100% が無く min-height:100% が解決されないため、
               ビューポート基準で高さを取る。これで .point-score-row の flex:1 が
               余白を吸収し、四隅の選手名が実際の隅に配置される。
               dvh はモバイルのアドレスバー分を除いた実高さ（非対応環境は vh にフォールバック） */
            width: 100%; min-height: 100vh; min-height: 100dvh;
            background: #fff;
            display: flex; flex-direction: column;
        }

        /* サーブ/レシーブ + 取消 */
        .header-row {
            display: flex; justify-content: space-between; align-items: stretch;
            font-weight: bold; background: #f0f0f0; flex-shrink: 0;
        }
        .role-button {
            flex: 1; text-align: center; padding: 0.45em 0.2em;
            cursor: default; border: none; background: transparent;
            font-size: 0.9em; font-weight: bold;
        }
        .role-button.is-serving { color: #1565c0; background: #cce5ff; }
        .role-button.undo {
            background: #c62828; color: #fff; cursor: pointer; font-weight: bold;
            border-radius: 0.4em;
            box-shadow: 0 0.2em 0 #7b0000, 0 0.25em 0.5em rgba(0,0,0,.4);
            transition: transform .08s, box-shadow .08s;
        }
        .role-button.undo:active {
            transform: translateY(0.13em);
            box-shadow: 0 0.07em 0 #7b0000, 0 0.08em 0.2em rgba(0,0,0,.25);
        }

        /* 選手番号バッジ */
        .num-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 1.45em; height: 1.45em; border-radius: 50%;
            background: #1565c0; color: #fff;
            font-size: 0.75em; font-weight: bold; flex-shrink: 0;
        }

        /* ポイントボタン */
        .player-name-row { display: flex; flex-shrink: 0; }
        .score-button {
            flex: 1; padding: 0.7em 0.3em; font-size: 0.85em;
            border: none; cursor: pointer; font-weight: bold;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.2em;
        }
        .score-button .btn-team-name  { font-size: 0.85em; opacity: 0.9; line-height: 1.3; }
        .score-button .btn-point-label { font-size: 1.5em; font-weight: bold; line-height: 1; }
        .score-button.p1 { background: #1565c0; color: #fff; }
        .score-button.p2 { background: #2e7d32; color: #fff; }
        .score-button:disabled { background: #ccc; cursor: not-allowed; }

        /* ── ダブルタップ・誤操作防止 ── */
        .score-button, .score-point, .action-button,
        .role-button.undo, .setup-btn, .court-half, .swap-sides-btn, .done-next-btn {
            touch-action: manipulation;
        }

        /* 審判コール */
        .umpire-call-area {
            position: relative; font-size: 1.15em; font-weight: bold; color: #333;
            padding: 0.5em 0.7em; min-height: 1.4em; background: #e9f5ff;
            border: 2px solid #aed9f7; border-radius: 0.5em; margin: 0.45em;
            flex-shrink: 0; text-align: center;
        }
        .umpire-sub {
            display: block; font-size: 0.65em; font-weight: normal;
            color: #555; margin-top: 0.2em;
        }
        .umpire-call-area::after {
            content: ''; position: absolute; bottom: -0.6em;
            left: 50%; transform: translateX(-50%);
            border-width: 0.6em 0.6em 0; border-style: solid;
            border-color: #e9f5ff transparent transparent; z-index: 1;
        }

        /* 確認ボタン */
        .action-button {
            width: 100%; padding: 0.8em; border: none; cursor: pointer;
            font-size: 1.3em; font-weight: bold; display: none; flex-shrink: 0;
            border-radius: 0.5em;
            transition: transform .08s, box-shadow .08s;
        }
        .action-button.confirm {
            background: #ffc107; color: #333;
            box-shadow: 0 0.22em 0 #a07800, 0 0.3em 0.7em rgba(0,0,0,.3);
            animation: pulse-confirm 1.5s ease-in-out infinite;
        }
        .action-button.end {
            background: #dc3545; color: #fff; padding: 1em;
            box-shadow: 0 0.22em 0 #8b0000, 0 0.3em 0.7em rgba(0,0,0,.4);
            animation: pulse-end 1.5s ease-in-out infinite;
        }
        .action-button:active {
            transform: translateY(0.14em);
            animation-play-state: paused;
        }
        .action-button.confirm:active { box-shadow: 0 0.08em 0 #a07800, 0 0.1em 0.2em rgba(0,0,0,.2); }
        .action-button.end:active     { box-shadow: 0 0.08em 0 #8b0000, 0 0.1em 0.2em rgba(0,0,0,.2); }

        /* ポイント大表示 */
        .point-score-row { position: relative; display: flex; flex: 1; min-height: 0; }
        .score-point {
            font-size: 5.5em; font-weight: 700; flex: 1;
            text-align: center; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .score-point.p1-bg { background: #cce5ff; }
        .score-point.p2-bg { background: #d4edda; }

        /* コート四隅の選手名。左半面は下＝デュース、右半面は上＝デュース */
        .court-pos {
            position: absolute; display: flex; align-items: center;
            justify-content: center; gap: 0.2em;
            font-size: 0.95em; font-weight: bold; line-height: 1.2;
            padding: 0.15em 0.45em; border-radius: 0.4em;
            max-width: 46%; text-align: center;
            pointer-events: none; user-select: none;
            transition: background .2s, color .2s;
        }
        .court-pos.tl { top: 4px;    left: 4px;  }
        .court-pos.bl { bottom: 4px; left: 4px;  }
        .court-pos.tr { top: 4px;    right: 4px; }
        .court-pos.br { bottom: 4px; right: 4px; }
        .court-pos.tl, .court-pos.bl { color: #0d47a1; }
        .court-pos.tr, .court-pos.br { color: #1b5e20; }
        /* サーブしている選手 */
        .court-pos.serving {
            background: #ffc107; color: #1a237e;
            box-shadow: 0 1px 4px rgba(0,0,0,.3);
        }
        .court-pos .num-badge { background: #1565c0; }
        .court-pos.tr .num-badge, .court-pos.br .num-badge { background: #2e7d32; }
        .court-pos.serving .num-badge { background: #1a237e; color: #ffc107; }
        .cd-serve-ball { font-size: 1.1em; line-height: 1; }

        /* ゲームスコア */
        .set-score-area { padding: 0.5em; background: #f9f9f9; flex-shrink: 0; }
        .set-score-label { font-size: 0.8em; font-weight: 600; color: #555; }
        .current-set-display { font-size: 2em; font-weight: bold; color: #333; }
        .set-history-display { font-size: 1.1em; color: #666; min-height: 1.3em; }
        .history-row {
            display: grid; grid-template-columns: 1fr auto 1fr;
            line-height: 1.4; align-items: center;
        }
        .history-score-left  { text-align: right; }
        .history-hyphen      { text-align: center; padding: 0 0.3em; }
        .history-score-right { text-align: left; }
        .winner-highlight    { background: yellow; font-weight: bold; }
        hr { border: 0; height: 1px; background: #eee; }

        /* ===== セットアップ画面 上部タイトル（第○試合 ○コート） ===== */
        .setup-match-title {
            text-align: center;
            font-size: 1em;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.06em;
            background: rgba(255,255,255,0.12);
            border-radius: 0.5em;
            padding: 0.35em 0.9em;
            align-self: center;
            line-height: 1.5;
        }
        .setup-match-title .title-games {
            display: block;
            font-size: 0.82em;
            font-weight: bold;
            opacity: 0.85;
            letter-spacing: 0.04em;
        }

        /* ===== 試合開始ボタン ===== */
        .setup-btn { font-size: 1.3em; padding: 0.9em 0.7em; text-align: center; }
        /* コート図内の選手番号バッジ */
        .cd-name .num-badge { background: rgba(255,255,255,0.9); color: #283593; }

        /* ===== 完了画面 ===== */
        #done-screen {
            position: fixed; inset: 0; z-index: 45; background: #1b5e20;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 0.7em; padding: 1.5em; text-align: center;
        }
        #done-screen .done-icon  { font-size: 3em; }
        #done-screen .done-title { color: #fff; font-size: 1.15em; font-weight: bold; }
        .done-teams-score {
            display: flex; align-items: center; justify-content: center;
            gap: 0.4em; flex-wrap: wrap; width: 100%; max-width: 520px;
        }
        .done-team-name {
            color: #a5d6a7; font-size: 0.88em; font-weight: bold;
            line-height: 1.4; flex: 1; min-width: 0;
        }
        .done-team-name.left  { text-align: right; }
        .done-team-name.right { text-align: left; }
        .done-score-num { color: #fff; font-size: 2.6em; font-weight: bold; white-space: nowrap; }
        .done-countdown { color: #a5d6a7; font-size: 0.78em; margin-top: 0.3em; }
        .done-next-btn {
            background: rgba(255,255,255,0.18); color: #fff;
            border: 2px solid rgba(255,255,255,0.45); border-radius: 0.65em;
            padding: 0.65em 2.2em; font-size: 0.95em; font-weight: bold;
            cursor: pointer; margin-top: 0.4em; letter-spacing: 0.05em;
        }
        .done-next-btn:active { opacity: 0.75; }

        /* ===== ダークモード ===== */
        body.dark { background: #111827; }
        body.dark .container { background: #1f2937; }
        body.dark .header-row { background: #111827; }
        body.dark .role-button { color: #bbb; }
        body.dark .role-button.is-serving { color: #64b5f6; background: #0d2b50; }
        body.dark .court-pos.tl, body.dark .court-pos.bl { color: #64b5f6; }
        body.dark .court-pos.tr, body.dark .court-pos.br { color: #81c784; }
        body.dark .court-pos.serving { background: #ffc107; color: #1a237e; }
        body.dark .score-point { color: #fff; }
        body.dark .score-point.p1-bg { background: #0d2137; }
        body.dark .score-point.p2-bg { background: #0a1f0d; }
        body.dark .umpire-call-area { background: #162035; border-color: #1565c0; color: #ddd; }
        body.dark .umpire-call-area::after { border-color: #162035 transparent transparent; }
        body.dark .set-score-area { background: #111827; }
        body.dark .current-set-display { color: #e0e0e0; }
        body.dark .set-history-display { color: #999; }
        body.dark .set-score-label { color: #888; }
        body.dark hr { background: #374151; }
        body.dark .score-button:disabled { background: #374151; color: #6b7280; }

        /* ===== テーマ切替スイッチ ===== */
        .theme-toggle {
            display: flex; align-items: center; gap: 0.25em;
            cursor: pointer; user-select: none; font-size: 0.85em;
        }
        /* アイコンの並びは 🌙（左） ／ ☀️（右）。
           ノブは現在のテーマ側に寄せる（ライト=☀️側、ダーク=🌙側）。
           display.html のトグルと同じ挙動に揃えてある */
        .theme-track {
            position: relative; width: 1.9em; height: 1.05em;
            background: #90caf9; border-radius: 1em;
            transition: background 0.3s; flex-shrink: 0;
        }
        body.dark .theme-track { background: #777; }
        .theme-thumb {
            position: absolute; left: 0.95em; top: 0.1em;
            width: 0.85em; height: 0.85em;
            background: #fff; border-radius: 50%; transition: left 0.3s;
        }
        body.dark .theme-thumb { left: 0.1em; }

        @keyframes pulse-confirm {
            0%, 100% { background: #ffc107; box-shadow: 0 0.22em 0 #a07800, 0 0.3em 0.7em rgba(0,0,0,.3); }
            50%       { background: #ffd04c; box-shadow: 0 0.22em 0 #a07800, 0 0.5em 1.6em rgba(255,193,7,.75), 0 0 22px rgba(255,193,7,.55); }
        }
        @keyframes pulse-end {
            0%, 100% { background: #dc3545; box-shadow: 0 0.22em 0 #8b0000, 0 0.3em 0.7em rgba(0,0,0,.4); }
            50%       { background: #f04858; box-shadow: 0 0.22em 0 #8b0000, 0 0.5em 1.6em rgba(220,53,69,.75), 0 0 22px rgba(220,53,69,.55); }
        }
    </style>
</head>
<body>

<!-- 引き継がれた通知 -->
<div class="overlay" id="ov-taken" style="display:none; background:#4a148c;">
    <div class="ov-icon">🔄</div>
    <div class="ov-msg">この画面の審判は<br>引き継がれました</div>
    <div class="ov-sub">このページを閉じてください</div>
</div>

<!-- ローディング -->
<div class="overlay" id="ov-loading">
    <div class="ov-icon">🔄</div>
    <div class="ov-msg">接続中...</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
</div>

<!-- 待機 -->
<div class="overlay" id="ov-waiting" style="display:none;">
    <div class="ov-icon">⏳</div>
    <div class="ov-msg" id="ov-waiting-msg">しばらくお待ちください</div>
    <div class="ov-sub">試合が組まれると自動で表示されます</div>
</div>

<!-- 試合設定画面（コート配置＋サーブを1画面で選択） -->
<div class="setup-screen" id="match-setup">
    <div class="setup-match-title" id="setup-match-title"></div>
    <h2>選手の配置を整え、サーブボタンを押してください</h2>
    <div class="sub" id="setup-hint">↔ で左右、↕ でペア内の並びを入れ替えられます</div>
    <!-- コートを上から見た配置。左半面は下、右半面は上がデュース側＝第1ゲームの
         サーバーが立つ位置。その枠だけを「サーブ」ボタンにしてある（名前ごとタップ可）。
         ↕ でペア内の並びを入れ替えると、そこに立つ選手が入れ替わる -->
    <div class="court-diagram">
        <button class="swap-sides-btn" onclick="swapSetupSides()" title="左右を入れ替え">&#x2194;</button>
        <div class="court-box">
            <div class="court-half" id="setup-half-left">
                <div class="cd-name" id="sl-top"></div>
                <button class="swap-pair-btn" onclick="swapSetupPair('left', event)"
                        title="ペア内の並びを入れ替え">&#x2195;</button>

<script>
// ── テーマ切替（ページ読み込み時に即時適用してちらつき防止） ──
(function() {
    if (localStorage.getItem('sc_theme') === 'dark') document.body.classList.add('dark');
})();
function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('sc_theme', isDark ? 'dark' : 'light');
}

// ── 全画面管理（display.php と共通設定 fs_preferred で引き継ぎ）──
function _scReqFS(el) {
    if (el.requestFullscreen)            return el.requestFullscreen();
    if (el.webkitRequestFullscreen)      return el.webkitRequestFullscreen();
    if (el.mozRequestFullScreen)         return el.mozRequestFullScreen();
    if (el.msRequestFullscreen)          return el.msRequestFullscreen();
}
function _scExitFS() {
    if (document.exitFullscreen)         return document.exitFullscreen();
    if (document.webkitExitFullscreen)   return document.webkitExitFullscreen();
    if (document.mozCancelFullScreen)    return document.mozCancelFullScreen();
    if (document.msExitFullscreen)       return document.msExitFullscreen();
}
function _scIsFS() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
}
function _scUpdateFSBtn() {
    const btn = document.getElementById('sc-fullscreen-btn');
    if (btn) btn.textContent = _scIsFS() ? '✕' : '⛶';
    // ESC やスワイプで全画面を抜けた場合、fs_preferred は '1' のままなので
    // フラグを戻しておかないと「次のタップで全画面」が二度と効かなくなる
    if (!_scIsFS()) _scAutoFsTriggered = false;
}
document.addEventListener('fullscreenchange', _scUpdateFSBtn);
document.addEventListener('webkitfullscreenchange', _scUpdateFSBtn);

window.scToggleFullscreen = function() {
    if (_scIsFS()) {
        _scExitFS();
        localStorage.setItem('fs_preferred', '0');
    } else {
        _scReqFS(document.documentElement);
        localStorage.setItem('fs_preferred', '1');
    }
};

// fs_preferred=1 のとき、全画面ボタン以外の最初のタッチ/クリックで自動全画面
var _scAutoFsTriggered = false;
function _scTryAutoFS(e) {
    if (e && e.target && e.target.closest('#sc-fullscreen-btn')) return;
    if (_scAutoFsTriggered || _scIsFS()) return;
    if (localStorage.getItem('fs_preferred') !== '1') return;
    _scAutoFsTriggered = true;
    // requestFullscreen は Promise を返す。未 catch だと iOS Safari など
    // 非対応/拒否環境で未処理 rejection が出るうえ、フラグが立ったままで再試行できない
    Promise.resolve(_scReqFS(document.documentElement))
        .catch(() => { _scAutoFsTriggered = false; });
}
document.addEventListener('touchstart', _scTryAutoFS);
document.addEventListener('click',      _scTryAutoFS);

// ── ② グローバルダブルタップ検出（500ms以内の2回目タップを無視） ──
(function() {
    var _lastTap = 0;
    document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - _lastTap < 500) {
            e.preventDefault();
            e.stopPropagation();
        }
        _lastTap = now;
    }, { passive: false });
})();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ── Firebase ──────────────────────────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyCsCHB2NaoRG5Q_D4u8VqeUghufZDTHTUE",
    authDomain: "roundrobin-c2631.firebaseapp.com",
    databaseURL: "https://roundrobin-c2631-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "roundrobin-c2631",
    storageBucket: "roundrobin-c2631.firebasestorage.app",
    messagingSenderId: "648952505350",
    appId: "1:648952505350:web:eb913450f350ba404ccf87"
};
const COURT_ALPHA = ['A','B','C','D','E','F'];
// この画面固有のID（引き継ぎ検知用）
const MY_REF_ID = Math.random().toString(36).substr(2, 10);

const params     = new URLSearchParams(location.search);
const sessionId  = params.get('session') || '';
const courtIndex = parseInt(params.get('court') || '0', 10);
// stay=1: QRコード等から直接起動した場合。試合終了後も display へ戻らずこのページに留まる
const stayMode   = params.get('stay') === '1';
// courtLabel は Firebase の courtNameAlpha 設定に応じて onStateUpdate で更新される
// 初期値はアルファベット表示（設定取得前の暫定値）
let courtLabel = COURT_ALPHA[courtIndex]
    ? COURT_ALPHA[courtIndex] + 'コート'
    : '第' + (courtIndex + 1) + 'コート';

document.getElementById('hd-court').textContent = courtLabel;

if (!sessionId) {
    showWaiting('URLが正しくありません\nセッションIDが見つかりません');
    throw new Error('No session ID');
}

const app      = initializeApp(firebaseConfig);
const db       = getDatabase(app);
const stateRef = ref(db, 'sessions/' + encodeURIComponent(sessionId));

// ── ゲーム設定（Firebase から取得） ──────────────────────────
let MATCH_GAMES = 3;  // 何ゲームマッチか
let WIN_GAMES   = 2;  // 何ゲーム先取か
let courtChangeEnabled = true; // コートチェンジあり/なし（デフォルト: あり）

// ── チーム情報 ────────────────────────────────────────────────
// team1/team2 は Firebase上の固定 (s1=team1のスコア, s2=team2のスコア)
// leftTeam: 画面左に表示するチーム (1 or 2)
let leftTeam    = 1;  // デフォルト: team1が左
let team1Names  = [];
let team2Names  = [];
let showPlayerNum = false;

// ── スコア状態 ────────────────────────────────────────────────
let game_score_t1 = 0;  // team1の現在ゲーム内ポイント
let game_score_t2 = 0;
let set_score_t1  = 0;  // team1のゲーム数 → Firebase s1
let set_score_t2  = 0;
let current_server = 1; // 1=team1サーブ, 2=team2サーブ
let game_is_over   = false;
let matchStarted   = false;
let historyStack   = [];

// Firebase上のマッチ情報
let currentMid = null;
let currentRoundLabel = '';
// playing書き込み中フラグ（書き込み完了前のonValue誤リセット防止）
let _statusWritePending = false;

// ── ローカル状態の保存/復元（リロード対応） ──────────────────────
const SC_LS_KEY = 'sc_v1_' + sessionId + '_c' + courtIndex;

function saveLocalState() {
    if (!currentMid || !matchStarted) return;
    try {
        localStorage.setItem(SC_LS_KEY, JSON.stringify({
            mid: currentMid,
            leftTeam, current_server, teamSwapped,
            set_score_t1, set_score_t2,
            game_score_t1, game_score_t2,
            game_is_over, matchStarted,
            historyStack,
            historyHTML: document.getElementById('game-history')?.innerHTML || '',
            umpireMsg:   document.getElementById('umpire-msg')?.dataset.msg  || ''
        }));
    } catch(e) {}
}

function clearLocalState() {
    localStorage.removeItem(SC_LS_KEY);
}

function restoreLocalState(mid) {
    try {
        const raw = localStorage.getItem(SC_LS_KEY);
        if (!raw) return false;
        const d = JSON.parse(raw);
        if (d.mid !== mid) return false;
        leftTeam       = d.leftTeam       ?? 1;
        current_server = d.current_server ?? 1;
        teamSwapped    = { 1: !!(d.teamSwapped && d.teamSwapped[1]),
                           2: !!(d.teamSwapped && d.teamSwapped[2]) };
        set_score_t1   = d.set_score_t1   ?? 0;
        set_score_t2   = d.set_score_t2   ?? 0;
        game_score_t1  = d.game_score_t1  ?? 0;
        game_score_t2  = d.game_score_t2  ?? 0;
        game_is_over   = d.game_is_over   ?? false;
        matchStarted   = d.matchStarted   ?? true;
        historyStack   = Array.isArray(d.historyStack) ? d.historyStack : [];
        const histEl = document.getElementById('game-history');
        if (histEl) histEl.innerHTML = d.historyHTML || '';
        const msgEl = document.getElementById('umpire-msg');
        if (msgEl) setUmpire(d.umpireMsg || '');
        return true;
    } catch(e) { return false; }
}

// ── Firebase監視 ─────────────────────────────────────────────
onValue(stateRef, snap => {
    const d = snap.val();
    if (!d) { showWaiting('セッションが見つかりません'); return; }
    const { _cid, ...stateData } = d;
    onStateUpdate(stateData);
});

function onStateUpdate(state) {
    hideAll();

    // ゲーム数を Firebase state から取得
    const newMatchGames = parseInt(state.matchGames) || 3;
    if (newMatchGames !== MATCH_GAMES && currentMid === null) {
        MATCH_GAMES = newMatchGames;
        WIN_GAMES   = Math.ceil(MATCH_GAMES / 2);
    }
    const gBadge = document.getElementById('hd-games');
    if (gBadge) gBadge.textContent = MATCH_GAMES + 'ゲームマッチ';

    // コートチェンジ設定を取得（デフォルト: true）
    courtChangeEnabled = state.courtChange !== false;

    showPlayerNum = !!state.showPlayerNum;

    // コートラベルを courtNameAlpha 設定に合わせて更新
    const newCourtLabel = state.courtNameAlpha
        ? (COURT_ALPHA[courtIndex] ? COURT_ALPHA[courtIndex] + 'コート' : '第' + (courtIndex + 1) + 'コート')
        : '第' + (courtIndex + 1) + 'コート';
    if (newCourtLabel !== courtLabel) {
        courtLabel = newCourtLabel;
        document.getElementById('hd-court').textContent = courtLabel;
        updateSetupTitles();
    }

    if (!Array.isArray(state.schedule) || state.schedule.length === 0) {
        showWaiting('まだ試合が組まれていません\nしばらくお待ちください');
        return;
    }

    const scores = state.scores    || {};
    const pnames = state.playerNames || {};
    const players = Array.isArray(state.players) ? state.players : [];

    // このコートのアクティブな試合を探す
    let found = null;
    for (const rd of state.schedule) {
        for (let ci = 0; ci < rd.courts.length; ci++) {
            const ct = rd.courts[ci];
            const physIdx = ct.physicalIndex !== undefined ? ct.physicalIndex : ci;
            if (physIdx !== courtIndex) continue;
            const mid = 'r' + rd.round + 'c' + ci;
            const sc  = scores[mid] || { s1: 0, s2: 0 };
            if (sc.done) continue;
            found = { rd, ct, ci, mid, sc };
            break;
        }
        if (found) break;
    }

    // ── 引き継ぎ検知：別の審判が同じコートを引き継いだ場合、この画面を無効化 ──
    // found が存在し、Firebase の refId が自分以外になっていたら操作不能にする
    // （完了画面・done状態の場合はチェック不要）
    if (found && matchStarted && found.sc.refId && found.sc.refId !== MY_REF_ID) {
        showTakenOver();
        return;
    }

    // 完了画面表示中 → カウントダウン中は割り込みさせない
    if (document.getElementById('done-screen').style.display === 'flex') {
        if (found && found.mid !== currentMid && stayMode) {
            // stayMode（QR起動）のみ: 次試合が来たらカウントダウン停止・完了画面を閉じて移行
            _clearDoneTimer();
            document.getElementById('done-screen').style.display = 'none';
            currentMid = found.mid;
            MATCH_GAMES = newMatchGames;
            WIN_GAMES   = Math.ceil(MATCH_GAMES / 2);
            document.getElementById('hd-games').textContent = MATCH_GAMES + 'ゲームマッチ';
            team1Names = found.ct.team1.map(id => buildName(id, pnames, showPlayerNum));
            team2Names = found.ct.team2.map(id => buildName(id, pnames, showPlayerNum));
            document.getElementById('hd-round').textContent = '第' + found.rd.round + '試合';
            resetMatch();
        }
        // stayMode=false の場合はカウントダウン（または「次へ」ボタン）で doneNext() を待つ
        return;
    }

    if (!found) {
        showWaiting('このコートの試合は\nまだ組まれていません\n\nしばらくお待ちください');
        return;
    }

    // チーム名（選手番号付き）
    team1Names = found.ct.team1.map(id => buildName(id, pnames, showPlayerNum));
    team2Names = found.ct.team2.map(id => buildName(id, pnames, showPlayerNum));

    currentRoundLabel = '第' + found.rd.round + '試合';
    document.getElementById('hd-round').textContent = currentRoundLabel;

    // 設定画面を表示中なら、選手名・番号表示の変更をコート図に反映
    if (document.getElementById('match-setup').style.display === 'flex') {
        updateSetupTitles();
        renderSetupCourt();
    }

    // 新しい試合が割り当てられた
    if (found.mid !== currentMid) {
        currentMid = found.mid;
        MATCH_GAMES = newMatchGames;
        WIN_GAMES   = Math.ceil(MATCH_GAMES / 2);
        // リロード時: 試合中かつローカル保存があれば完全復元
        const fStatus = found.sc.status || ((found.sc.s1 > 0 || found.sc.s2 > 0) ? 'playing' : 'calling');
        if (fStatus === 'playing' && restoreLocalState(found.mid)) {
            // Firebase の値で上書き（サーバー側が正）
            set_score_t1  = found.sc.s1  ?? set_score_t1;
            set_score_t2  = found.sc.s2  ?? set_score_t2;
            game_score_t1 = found.sc.pt1 ?? game_score_t1;
            game_score_t2 = found.sc.pt2 ?? game_score_t2;
            matchStarted = true;
            showMain();
            // リロード時は MY_REF_ID が変わるため、自分のIDを Firebase に上書きして
            // 引き継ぎ誤検知（旧IDと不一致 → ロックアウト）を防ぐ
            writeRefId();
        } else if (fStatus === 'playing') {
            // localStorageなし（別端末・キャッシュクリア等）
            // Firebase に server/left が保存されていれば途中から直接再開
            const hasServInfo = found.sc.server != null && found.sc.left != null;
            resetMatch(); // スコアリセット + showMatchSetup() が呼ばれる
            set_score_t1   = found.sc.s1  || 0;
            set_score_t2   = found.sc.s2  || 0;
            game_score_t1  = found.sc.pt1 || 0;
            game_score_t2  = found.sc.pt2 || 0;
            if (hasServInfo) {
                // サーブ・コートサイド・ペア内の並びを Firebase から復元してメイン画面へ
                current_server = found.sc.server;
                leftTeam       = found.sc.left;
                teamSwapped    = { 1: !!found.sc.sw1, 2: !!found.sc.sw2 };
                matchStarted   = true;
                hideAll();
                showMain();
                updateUmpireCall();
                checkGameWinner(); // ゲーム終了状態ならボタンを正しく表示
                // 引き継ぎ時も自分のIDをすぐに書き込む（旧refIdとの不一致でロックアウトされるのを防ぐ）
                writeRefId();
            }
            // hasServInfo=false の場合はサーブ選択画面からやり直し（resetMatch済み）
        } else {
            resetMatch();
        }
        return;
    }

    // ─ 同じ試合 → status で画面を決定 ─────────────────────────
    // status が未設定の場合はスコアで後方互換判定
    const courtStatus = found.sc.status
        || ((found.sc.s1 > 0 || found.sc.s2 > 0) ? 'playing' : 'calling');

    if (courtStatus === 'playing') {
        if (matchStarted) {
            showMain();             // 通常の試合中
        } else {
            showMatchSetup();       // Firebase側がplayingだが手元で設定未完了
        }
    } else {
        // 'calling'
        if (matchStarted && !_statusWritePending) {
            resetMatch();           // 外部からcallingに戻された → リセット
        } else if (!matchStarted) {
            // 設定待ち。選択済みの内容は消さずに再描画のみ行う
            showMatchSetup();
        } else {
            // _statusWritePending 中（playing 書き込み完了待ち）はリセットしない。
            // ただし冒頭の hideAll() で全画面が消えているため、
            // ここで再表示しないと一瞬まっさらな画面になってしまう
            showMain();
        }
    }
}

// ── 選手名生成 ───────────────────────────────────────────────
function buildName(id, pnames, withNum) {
    const name = pnames[id] || ('選手' + id);
    return { id, name, withNum };
}

// innerHTML に差し込むためHTMLエスケープする（選手名に < > & 等が入っても崩れない）
function _scEsc(s) {
    return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderName(nameObj) {
    if (nameObj.withNum) {
        return `<span class="pname"><span class="num-badge">${_scEsc(nameObj.id)}</span>${_scEsc(nameObj.name)}</span>`;
    }
    return `<span class="pname">${_scEsc(nameObj.name)}</span>`;
}

function teamNamesToText(names) {
    return names.map(n => n.name).join(' / ');
}

// ── マッチリセット ────────────────────────────────────────────
function resetMatch() {
    game_score_t1 = 0; game_score_t2 = 0;
    set_score_t1  = 0; set_score_t2  = 0;
    game_is_over  = false; matchStarted = false;
    historyStack  = [];
    resetSetupSelection();   // leftTeam=1 / サーブ未選択に戻す
    document.getElementById('game-history').innerHTML = '';
    document.getElementById('btn-confirm').style.display = 'none';
    document.getElementById('btn-end').style.display     = 'none';
    document.getElementById('btn-undo').style.display    = '';
    document.getElementById('umpire-msg').textContent    = 'プレイボール';
    togglePointButtons(false);

    // 試合設定画面へ
    showMatchSetup();
}

// ── セットアップ画面タイトル更新 ────────────────────────────
function updateSetupTitles() {
    const line1 = currentRoundLabel ? currentRoundLabel + '　' + courtLabel : courtLabel;
    const el = document.getElementById('setup-match-title');
    if (el) el.innerHTML = `${line1}<span class="title-games">${MATCH_GAMES}ゲームマッチ</span>`;
}

// ── 試合設定（コート配置＋サーブを1画面で選択） ────────────────
// setupServeTeam: サーブするチーム（1 or 2、未選択は null）
// leftTeam:       画面左＝コート左側に配置するチーム（↔ ボタンで入れ替え）
let setupServeTeam = null;

// teamSwapped[t] … チームtのペア内の並びを入れ替えたか（↕ ボタン）。
// 各チームは [デュース側, アド側] の2枠を持ち、デュース側の選手がそのチームの
// 1人目＝最初のサービスゲームを打つ選手になる。
// コートは上から見た配置なので、デュース側は左半面なら下、右半面なら上。
let teamSwapped = { 1: false, 2: false };

// チームtの選手を [デュース側, アド側] の順で返す
function teamSlots(team) {
    const names = (team === 1 ? team1Names : team2Names) || [];
    return teamSwapped[team] ? [names[1], names[0]] : [names[0], names[1]];
}

// 選択内容の初期化。新しい試合に入るとき・取消で戻るときだけ呼ぶ。
// ※ showMatchSetup() 側でリセットしてはいけない。onStateUpdate は Firebase 更新の
//   たびに showMatchSetup() を呼ぶため、主審が選択済みのサーブ側が消えてしまう。
function resetSetupSelection() {
    setupServeTeam = null;
    leftTeam = 1;               // 既定はチーム1が左
    teamSwapped = { 1: false, 2: false };
}

function showMatchSetup() {
    hideAll();
    updateSetupTitles();
    renderSetupCourt();
    document.getElementById('match-setup').style.display = 'flex';
}

function teamNamesToHTML(names) {
    return names.map(renderName).join(' / ');
}

// コート図の描画（四隅の選手名・サーブ表示・開始ボタンの活性）
function renderSetupCourt() {
    const rightTeam = 3 - leftTeam;

    // 左半面は下、右半面は上がデュース側（＝第1ゲームのサーバーが立つ位置）。
    // デュース枠だけが「サーブ」ボタンで、そこに立つ選手が最初のサーバーになる。
    const fill = (team, deuceId, adId) => {
        const [deuce, ad] = teamSlots(team);
        const isServing = setupServeTeam === team;
        const dEl = document.getElementById(deuceId);
        if (dEl) {
            dEl.innerHTML = (deuce ? renderName(deuce) : '')
                + '<div class="cd-serve-label">🎾 サーブ</div>';
            dEl.classList.toggle('selected', isServing);
        }
        const aEl = document.getElementById(adId);
        if (aEl) aEl.innerHTML = ad ? renderName(ad) : '';
    };
    fill(leftTeam,  'sl-bot', 'sl-top');   // 左半面 → 下がデュース
    fill(rightTeam, 'sr-top', 'sr-bot');   // 右半面 → 上がデュース

    const hint = document.getElementById('setup-hint');
    if (hint) {
        if (setupServeTeam === null) {
            hint.textContent = '↔ で左右、↕ でペア内の並びを入れ替えられます';
        } else {
            const first = teamSlots(setupServeTeam)[0];
            hint.textContent = '「' + (first ? first.name : '') + '」のサーブで開始します';
        }
    }
    const btn = document.getElementById('setup-start-btn');
    if (btn) btn.disabled = (setupServeTeam === null);
}

// コート半面のタップ → その側のチームをサーブ側に指定（再タップで解除）
window.onSetupTeamTap = function(side) {
    const team = (side === 'left') ? leftTeam : (3 - leftTeam);
    setupServeTeam = (setupServeTeam === team) ? null : team;
    renderSetupCourt();
};

// ↕ ボタン → ペア内の並びを入れ替える（半面タップのサーブ選択とは独立）
window.swapSetupPair = function(side, e) {
    if (e) e.stopPropagation();   // 親の onSetupTeamTap を発火させない
    const team = (side === 'left') ? leftTeam : (3 - leftTeam);
    teamSwapped[team] = !teamSwapped[team];
    renderSetupCourt();
};

// ↔ ボタン → 左右のチームを入れ替える
// サーブ選択は「チーム」に紐づくため、入れ替えても選択は維持される
window.swapSetupSides = function() {
    leftTeam = 3 - leftTeam;
    renderSetupCourt();
};

// 「試合開始」→ サーブ側を確定して試合を開始
window.startMatch = async function() {
    if (setupServeTeam === null) return;   // 未選択なら開始しない
    current_server = setupServeTeam;
    // 試合開始（ボタン状態は updateDisplay() が matchStarted で管理）
    hideAll();
    matchStarted = true;
    showMain();
    saveLocalState();
    // Firebase に「試合中」を書き込む（完了前のonValueによる誤リセットを防止）
    _statusWritePending = true;
    await writeStatus('playing');
    _statusWritePending = false;
};

// ── メイン画面表示 ────────────────────────────────────────────
function showMain() {
    document.getElementById('main-container').style.display = 'flex';
    updateDisplay();
}

// ── ③ ポイントボタンdebounce（500ms以内の連打を無視） ──────────
let _pointDebouncing = false;

// ── ポイント追加 ──────────────────────────────────────────────
window.addPoint = function(side) {
    if (game_is_over) return;
    if (_pointDebouncing) return;
    _pointDebouncing = true;
    setTimeout(() => { _pointDebouncing = false; }, 500);
    // side='left' or 'right' → team
    const winner = side === 'left' ? leftTeam : (3 - leftTeam);

    historyStack.push({
        type: 'point',
        game_score_t1, game_score_t2, current_server,
        umpireMsg: document.getElementById('umpire-msg').dataset.msg || ''
    });

    if (winner === 1) game_score_t1++;
    else              game_score_t2++;

    updateDisplay();
    updateUmpireCall();
    checkGameWinner();
    writeCurrentPoints();   // displayにリアルタイム反映
    saveLocalState();
};

// ── 審判コール ────────────────────────────────────────────────
function updateUmpireCall() {
    const words = ['ゼロ','ワン','ツー','スリー'];
    // 左右のポイントで表示（サーバー側を先に）
    const p_sv = current_server === 1 ? game_score_t1 : game_score_t2; // サーバーのポイント
    const p_rc = current_server === 1 ? game_score_t2 : game_score_t1; // レシーバーのポイント

    if (p_sv === 3 && p_rc === 3) { setUmpire('デュース'); return; }
    if (p_sv >= 3 && p_rc >= 3) {
        if (p_sv === p_rc) {
            setUmpire(p_sv === 4 ? 'フォー・オール' : 'デュース');
            return;
        }
        setUmpire('アドバンテージ ' + (p_sv > p_rc ? 'サーバー' : 'レシーバー'));
        return;
    }
    if (p_sv === p_rc && p_sv > 0) { setUmpire((words[p_sv] || p_sv) + 'オール'); return; }
    setUmpire((words[p_sv] || p_sv) + ' - ' + (words[p_rc] || p_rc));
}
function setUmpire(msg) {
    const el = document.getElementById('umpire-msg');
    el.dataset.msg = msg;
    const subMap = {
        'チェンジコート':   '（次のゲームへボタンを押してください）',
        'チェンジサービス': '（次のゲームへボタンを押してください）',
    };
    let sub = subMap[msg];
    if (!sub && msg.startsWith('ゲームセット')) sub = '（試合終了ボタンを押してください）';
    if (sub) {
        el.innerHTML = msg + '<span class="umpire-sub">' + sub + '</span>';
    } else {
        el.textContent = msg;
    }
}

// ── ゲーム終了チェック ────────────────────────────────────────
function checkGameWinner() {
    const p1 = game_score_t1, p2 = game_score_t2;
    let won = false;
    if (p1 === 3 && p2 === 3) return;
    if (p1 >= 4 || p2 >= 4) {
        if      (p1 >= 4 && p2 < 3) won = true;
        else if (p2 >= 4 && p1 < 3) won = true;
        else if (p1 === 5 && p2 <= 4) won = true;
        else if (p2 === 5 && p1 <= 4) won = true;
    }
    if (!won) return;

    game_is_over = true;
    togglePointButtons(true);

    const winner = game_score_t1 > game_score_t2 ? 1 : 2;
    const nextS1 = set_score_t1 + (winner === 1 ? 1 : 0);
    const nextS2 = set_score_t2 + (winner === 2 ? 1 : 0);
    const isMatchEnd = nextS1 >= WIN_GAMES || nextS2 >= WIN_GAMES;
    const total = set_score_t1 + set_score_t2 + 1;

    if (isMatchEnd) {
        setUmpire('ゲームセット ' + (leftTeam === 1 ? nextS1 : nextS2) + ' - ' + (leftTeam === 1 ? nextS2 : nextS1));
        document.getElementById('btn-end').style.display = 'block';
    } else if (total % 2 !== 0) {
        // 奇数ゲーム終了：コートチェンジあり→「チェンジサイズ」、なし→「チェンジサービス」
        setUmpire(courtChangeEnabled ? 'チェンジコート' : 'チェンジサービス');
        document.getElementById('btn-confirm').style.display = 'block';
    } else {
        setUmpire('チェンジサービス');
        document.getElementById('btn-confirm').style.display = 'block';
    }
}

// ── 次ゲームへ ────────────────────────────────────────────────
window.handleGameConfirm = async function() {
    if (!game_is_over) return;
    const winner = game_score_t1 > game_score_t2 ? 1 : 2;

    historyStack.push({
        type: 'confirm',
        game_score_t1, game_score_t2, set_score_t1, set_score_t2,
        current_server, leftTeam,
        historyHTML: document.getElementById('game-history').innerHTML,
        umpireMsg: document.getElementById('umpire-msg').dataset.msg || ''
    });

    if (winner === 1) set_score_t1++;
    else              set_score_t2++;

    addGameHistoryRow(winner);
    await writeScore(false);

    game_score_t1 = 0; game_score_t2 = 0;
    game_is_over  = false;
    document.getElementById('btn-confirm').style.display = 'none';
    togglePointButtons(false);
    writeCurrentPoints();   // pt1/pt2を0にリセット

    const totalAfter = set_score_t1 + set_score_t2;
    // サービス交代
    current_server = current_server === 1 ? 2 : 1;
    // チェンジサイズ（奇数ゲーム後 かつ コートチェンジあり）
    if (totalAfter % 2 !== 0 && courtChangeEnabled) {
        leftTeam = leftTeam === 1 ? 2 : 1;
        swapHistoryRows();
    }

    updateDisplay();
    // ゲームカウントはサーバー側を先に呼ぶ（ポイントコールと同じルール）
    const _svGames = current_server === 1 ? set_score_t1 : set_score_t2;
    const _rcGames = current_server === 1 ? set_score_t2 : set_score_t1;
    setUmpire('ゲームカウント ' + _svGames + ' - ' + _rcGames);
    saveLocalState();
};

// ── 完了画面カウントダウン停止 ─────────────────────────────────
let _doneTimer = null;
function _clearDoneTimer() {
    if (_doneTimer) { clearInterval(_doneTimer); _doneTimer = null; }
}

// ── 「次へ進む」ボタン / カウントダウン満了時の処理 ─────────────
window.doneNext = function() {
    _clearDoneTimer();
    if (stayMode) {
        // stayMode: 完了画面を閉じて待機状態へ
        document.getElementById('done-screen').style.display = 'none';
        // onStateUpdate が次の試合を検知したら自動切り替えされる
        showWaiting('次の試合が始まるまでお待ちください');
    } else {
        // 通常モード: 案内パネルへ移動
        location.href = '/display?sid=' + encodeURIComponent(sessionId);
    }
};

// ── 完了画面カウントダウン開始（30秒） ─────────────────────────
function _startDoneCountdown() {
    _clearDoneTimer();
    let sec = 30;
    const cdEl = document.getElementById('done-countdown');
    if (cdEl) cdEl.textContent = sec + ' 秒後に自動で次へ進みます';
    _doneTimer = setInterval(() => {
        sec--;
        if (cdEl) cdEl.textContent = sec + ' 秒後に自動で次へ進みます';
        if (sec <= 0) { _clearDoneTimer(); window.doneNext(); }
    }, 1000);
}

// ── 試合終了 ──────────────────────────────────────────────────
window.handleMatchEnd = async function() {
    if (!game_is_over) return;
    const winner = game_score_t1 > game_score_t2 ? 1 : 2;
    if (winner === 1) set_score_t1++;
    else              set_score_t2++;
    addGameHistoryRow(winner);
    document.getElementById('btn-end').style.display = 'none';
    document.getElementById('btn-undo').style.display = 'none';

    // ── 先に完了画面を表示する ──────────────────────────────────
    // Firebase の update() はローカルキャッシュを即時更新して onValue を同期発火させる。
    // done-screen を先に flex にしておくことで、onStateUpdate が呼ばれたとき
    // 「done-screen が表示中」と判断して waiting overlay を出さずに return する。
    clearLocalState();

    // スコア（左チーム基準）
    const finalScore =
        (leftTeam === 1 ? set_score_t1 : set_score_t2) + ' - ' +
        (leftTeam === 1 ? set_score_t2 : set_score_t1);
    document.getElementById('done-score-text').textContent = finalScore;

    // チーム名（左右）
    const leftNames  = (leftTeam === 1 ? team1Names : team2Names).map(n => n.name).join(' ・ ');
    const rightNames = (leftTeam === 1 ? team2Names : team1Names).map(n => n.name).join(' ・ ');
    document.getElementById('done-left-name').textContent  = leftNames;
    document.getElementById('done-right-name').textContent = rightNames;

    document.getElementById('done-screen').style.display = 'flex';

    try {
        await writeScore(true);
        // Firebase 書き込み成功後にカウントダウン開始
        _startDoneCountdown();
    } catch(e) {
        console.error(e);
        // 書き込み失敗時は完了画面を隠してロールバック
        _clearDoneTimer();
        document.getElementById('done-screen').style.display = 'none';
        alert('送信に失敗しました。再度お試しください。');
        if (winner === 1) set_score_t1--;
        else              set_score_t2--;
        document.getElementById('btn-end').style.display = 'block';
        document.getElementById('btn-undo').style.display = 'inline-block';
    }
};

// ── 取消 ──────────────────────────────────────────────────────
window.undoLastPoint = function() {
    // ④ 戻るボタン確認ダイアログ
    const msg = historyStack.length === 0 ? '試合設定に戻りますか？' : '1点取り消しますか？';
    if (!confirm(msg)) return;

    if (historyStack.length === 0) {
        // 0-0 の状態 → 試合設定画面に戻る（コート配置・サーブを選び直す）
        matchStarted = false;
        game_score_t1 = 0; game_score_t2 = 0;
        current_server = 1;
        resetSetupSelection();
        showMatchSetup();
        // Firebase に「呼び出し中」とスコアリセットを書き込む
        writeStatus('calling', true);
        return;
    }
    if (game_is_over) {
        game_is_over = false;
        togglePointButtons(false);
        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-end').style.display     = 'none';
    }
    const last = historyStack.pop();
    if (last.type === 'confirm') {
        set_score_t1 = last.set_score_t1;
        set_score_t2 = last.set_score_t2;
        leftTeam = last.leftTeam;
        document.getElementById('game-history').innerHTML = last.historyHTML;
        game_score_t1 = last.game_score_t1;
        game_score_t2 = last.game_score_t2;
        current_server = last.current_server;
        setUmpire(last.umpireMsg);
        undoLastPoint();
        return;
    }
    game_score_t1 = last.game_score_t1;
    game_score_t2 = last.game_score_t2;
    current_server = last.current_server;
    setUmpire(last.umpireMsg);
    // ボタン状態は updateDisplay() が matchStarted で一元管理する
    updateDisplay();
    writeCurrentPoints();   // 取消後のポイントをFirebaseに反映
    saveLocalState();
};

// ── 表示更新 ──────────────────────────────────────────────────
function updateDisplay() {
    // ─ 戻る／取消ボタンのラベル切替 ────────────────────────────
    const undoBtn = document.getElementById('btn-undo');
    undoBtn.textContent = '戻る';

    // 左右のチーム
    const leftNames  = leftTeam === 1 ? team1Names : team2Names;
    const rightNames = leftTeam === 1 ? team2Names : team1Names;

    // ポイントボタンのラベル（名前 + 大きい「ポイント」）
    document.getElementById('btn-left').innerHTML  =
        '<span class="btn-team-name">' + _scEsc(teamNamesToText(leftNames))  + '</span>' +
        '<span class="btn-point-label">ポイント</span>';
    document.getElementById('btn-right').innerHTML =
        '<span class="btn-team-name">' + _scEsc(teamNamesToText(rightNames)) + '</span>' +
        '<span class="btn-point-label">ポイント</span>';

    // ポイント大表示（左右の表示）
    const leftPt  = leftTeam === 1 ? game_score_t1 : game_score_t2;
    const rightPt = leftTeam === 1 ? game_score_t2 : game_score_t1;
    document.getElementById('pt-left').textContent  = leftPt;
    document.getElementById('pt-right').textContent = rightPt;

    // ゲームカウント（左右表示）
    const leftGames  = leftTeam === 1 ? set_score_t1 : set_score_t2;
    const rightGames = leftTeam === 1 ? set_score_t2 : set_score_t1;
    document.getElementById('current-game-score').textContent = leftGames + ' - ' + rightGames;

    // サーブ/レシーブ表示
    updateRoleButtons();
    updateCourtPositions();
}

function updateRoleButtons() {
    const leftIsServer = (current_server === leftTeam);
    document.getElementById('role-left').classList.toggle('is-serving', leftIsServer);
    document.getElementById('role-right').classList.toggle('is-serving', !leftIsServer);
    document.getElementById('role-left').textContent  = leftIsServer  ? 'サーブ' : 'レシーブ';
    document.getElementById('role-right').textContent = !leftIsServer ? 'サーブ' : 'レシーブ';
}

// 現在のゲーム番号（0始まり）＝ 完了ゲーム数
function currentGameIndex() { return set_score_t1 + set_score_t2; }

// チームtの、このゲーム開始時点での [デュース側の選手, アド側の選手]。
//
// ルール: サービスゲームを打ち終えた選手は、最後のサーブ位置に関わらずアド側へ移る。
// したがってチームの並びは「そのチームが消化したサービスゲーム数」が奇数のとき
// 設定画面での初期配置から入れ替わる。
//
// 消化数はゲーム番号から求まるので状態を持つ必要がない。
// これにより「戻る」で巻き戻しても、別端末から引き継いでも自動的に正しくなる
// （set_score_t1/t2 と current_server はどちらの経路でも復元されるため）。
function teamArrangement(team) {
    const n = currentGameIndex();
    // 第1ゲームをサーブしたチーム。偶数ゲームは第1ゲームと同じチームがサーブする
    const firstTeam = (n % 2 === 0) ? current_server : (3 - current_server);
    // 第0..n-1ゲームのうち、このチームが打ったサービスゲーム数
    const served = (team === firstTeam) ? Math.ceil(n / 2) : Math.floor(n / 2);
    const [p0, p1] = teamSlots(team);
    return (served % 2 === 0) ? [p0, p1] : [p1, p0];
}

// コート四隅の選手名を更新する。
// ・サーブ側のペアはポイントごとに上下が入れ替わる（サーバーが立つ側に🎾）
// ・レシーブ側は固定（デュースレシーバー／アドレシーバーは1セット通して同じ）
function updateCourtPositions() {
    const rightTeam = 3 - leftTeam;
    const isDeuce   = (game_score_t1 + game_score_t2) % 2 === 0; // 偶数ポイント＝デュースコートから

    // そのチームの [デュース位置の選手, アド位置の選手] と、🎾 を置く位置を返す
    const layout = (team) => {
        // ゲーム開始時点の並び。サーブ側はこのデュース枠の選手がサーバー
        const [deuce, ad] = teamArrangement(team);
        if (current_server !== team) {
            return { deuce, ad, ball: null }; // レシーブ側はゲーム中固定
        }
        // サーブ側はポイントごとに上下が入れ替わる（サーバーが立つ側に🎾）
        return isDeuce
            ? { deuce: deuce, ad: ad,    ball: 'deuce' }
            : { deuce: ad,    ad: deuce, ball: 'ad' };
    };

    const set = (elId, player, isServing) => {
        const el = document.getElementById(elId);
        if (!el) return;
        const ball = isServing ? '<span class="cd-serve-ball">🎾</span> ' : '';
        el.innerHTML = ball + (player ? renderName(player) : '');
        el.classList.toggle('serving', !!isServing);
    };

    const L = layout(leftTeam), R = layout(rightTeam);
    // 左半面は下＝デュース、右半面は上＝デュース
    set('pos-bl', L.deuce, L.ball === 'deuce');
    set('pos-tl', L.ad,    L.ball === 'ad');
    set('pos-tr', R.deuce, R.ball === 'deuce');
    set('pos-br', R.ad,    R.ball === 'ad');
}

function togglePointButtons(disabled) {
    document.getElementById('btn-left').disabled  = disabled;
    document.getElementById('btn-right').disabled = disabled;
}

function addGameHistoryRow(winner) {
    const leftWon = (winner === leftTeam);
    const lPt = leftTeam === 1 ? game_score_t1 : game_score_t2;
    const rPt = leftTeam === 1 ? game_score_t2 : game_score_t1;
    const row = leftWon
        ? `<div class="history-row">
               <span class="history-score-left"><span class="winner-highlight">${lPt}</span></span>
               <span class="history-hyphen">-</span>
               <span class="history-score-right">${rPt}</span>
           </div>`
        : `<div class="history-row">
               <span class="history-score-left">${lPt}</span>
               <span class="history-hyphen">-</span>
               <span class="history-score-right"><span class="winner-highlight">${rPt}</span></span>
           </div>`;
    document.getElementById('game-history').innerHTML += row;
}

// チェンジサイズ時にゲーム履歴の左右を入れ替え
function swapHistoryRows() {
    document.querySelectorAll('#game-history .history-row').forEach(row => {
        const l = row.querySelector('.history-score-left');
        const r = row.querySelector('.history-score-right');
        [l.innerHTML, r.innerHTML] = [r.innerHTML, l.innerHTML];
    });
}

// ── 現在ゲームのポイント＋サーブ情報をFirebaseに書き込み（fire-and-forget）──
// server(1 or 2) と left(1 or 2) も保存することで、別端末が途中参加しても
// サーブ選択画面をスキップしてメイン画面から再開できるようにする。
function writeCurrentPoints() {
    if (!currentMid) return;
    const upd = {};
    upd['scores/' + currentMid + '/pt1']    = game_score_t1;
    upd['scores/' + currentMid + '/pt2']    = game_score_t2;
    upd['scores/' + currentMid + '/server'] = current_server;
    upd['scores/' + currentMid + '/left']   = leftTeam;
    upd['_cid'] = 'court-' + courtIndex + '-' + Date.now();
    update(stateRef, upd).catch(e => console.warn('writeCurrentPoints:', e));
}

// ── refId だけ書き込む（リロード・引き継ぎ直接復元時に自分のIDを主張する）─────
function writeRefId() {
    if (!currentMid) return;
    const upd = {};
    upd['scores/' + currentMid + '/refId'] = MY_REF_ID;
    upd['_cid'] = 'court-' + courtIndex + '-' + Date.now();
    update(stateRef, upd).catch(e => console.warn('writeRefId:', e));
}

// ── ステータス書き込み ─────────────────────────────────────────
async function writeStatus(status, resetScores = false) {
    if (!currentMid) return;
    const upd = {};
    upd['scores/' + currentMid + '/status'] = status;
    if (status === 'playing') {
        // 試合開始時点のサーブ権・コートサイドも Firebase に保存
        upd['scores/' + currentMid + '/server'] = current_server;
        upd['scores/' + currentMid + '/left']   = leftTeam;
        // ペア内の並び（どちらがデュース側＝1人目か）。別端末での引き継ぎ時に
        // 四隅の配置とサーブ順を復元するために必要
        upd['scores/' + currentMid + '/sw1']    = !!teamSwapped[1];
        upd['scores/' + currentMid + '/sw2']    = !!teamSwapped[2];
        // s1/s2 が Firebase に未存在の場合（generateNextRound 後など）でも
        // roundrobin.php に undefined が表示されないよう必ず書き込む
        upd['scores/' + currentMid + '/s1']     = set_score_t1;
        upd['scores/' + currentMid + '/s2']     = set_score_t2;
        // この審判のIDを書き込む（古い審判画面の引き継ぎ検知に使用）
        upd['scores/' + currentMid + '/refId']  = MY_REF_ID;
    }
    if (resetScores) {
        upd['scores/' + currentMid + '/s1']     = 0;
        upd['scores/' + currentMid + '/s2']     = 0;
        upd['scores/' + currentMid + '/pt1']    = 0;
        upd['scores/' + currentMid + '/pt2']    = 0;
        upd['scores/' + currentMid + '/server'] = null;
        upd['scores/' + currentMid + '/left']   = null;
        upd['scores/' + currentMid + '/sw1']    = null;
        upd['scores/' + currentMid + '/sw2']    = null;
    }
    upd['_cid'] = 'court-' + courtIndex + '-' + Date.now();
    await update(stateRef, upd);
}

// ── Firebase書き込み ───────────────────────────────────────────
async function writeScore(done) {
    if (!currentMid) return;
    const upd = {};
    upd['scores/' + currentMid + '/s1'] = set_score_t1;
    upd['scores/' + currentMid + '/s2'] = set_score_t2;
    if (done) upd['scores/' + currentMid + '/done'] = true;
    upd['_cid'] = 'court-' + courtIndex + '-' + Date.now();
    await update(stateRef, upd);
}

// ── 画面制御 ─────────────────────────────────────────────────
function hideAll() {
    ['ov-loading','ov-waiting','ov-taken'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
    ['match-setup','main-container'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
}

// ── 引き継ぎ検知：この画面を無効化して通知を表示 ──────────────────
let _takenOver = false;
function showTakenOver() {
    if (_takenOver) return;
    _takenOver = true;
    _clearDoneTimer();
    // 全画面を隠してから引き継ぎオーバーレイを表示
    ['ov-loading','ov-waiting','match-setup','main-container'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
    document.getElementById('done-screen').style.display = 'none';
    const el = document.getElementById('ov-taken');
    if (el) el.style.display = 'flex';
}

function showWaiting(msg) {
    hideAll();
    const el = document.getElementById('ov-waiting');
    if (el) el.style.display = 'flex';
    const msgEl = document.getElementById('ov-waiting-msg');
    if (msgEl) msgEl.textContent = msg;
}
</script>
</body>
