<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次の試合</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: #2d3748;
        color: #fff;
        font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', Arial, sans-serif;
        display: flex; flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    header {
        background: #1a202c;
        border-bottom: 3px solid #e07b2a;
        padding: 0.6em 1.1em;
        display: flex; align-items: center; justify-content: space-between;
        gap: 1em; flex-shrink: 0;
    }
    header h1 {
        font-size: clamp(1.1rem, 2.6vw, 2.4rem);
        font-weight: bold; line-height: 1.3;
    }
    .hd-right {
        display: flex; align-items: center; gap: 0.8em;
        flex-shrink: 0;
    }
    .updated {
        font-size: clamp(0.7rem, 1.1vw, 1.05rem);
        color: #a0aec0; white-space: nowrap;
    }
    .updated .dot {
        display: inline-block; width: 0.6em; height: 0.6em;
        background: #68d391; border-radius: 50%;
        margin-right: 0.35em; vertical-align: middle;
        animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .refresh-btn {
        background: none; border: 1px solid rgba(255,255,255,0.35);
        border-radius: 0.4em; color: #ddd;
        padding: 0.4em 0.9em; cursor: pointer;
        font-size: clamp(0.7rem, 1.1vw, 1.05rem);
        white-space: nowrap; touch-action: manipulation;
    }
    .refresh-btn:active { opacity: 0.7; }

    /* ===== ボード ===== */
    #board {
        flex: 1; padding: clamp(0.7rem, 1.6vw, 1.8rem);
        display: grid; gap: clamp(0.7rem, 1.6vw, 1.8rem);
        /* 列数はコート数に応じてJSで設定（画面いっぱいに広げる） */
        grid-auto-rows: 1fr;
        align-content: stretch;
    }

    .court-card {
        background: #1a202c;
        border-radius: 0.7em;
        border: 3px solid #4a5568;
        overflow: hidden;
        display: flex; flex-direction: column;
    }
    .court-card.has-next { border-color: #e07b2a; }

    .cc-head {
        background: #e07b2a;
        padding: 0.45em 0.8em;
        display: flex; align-items: center; gap: 0.6em;
        flex-wrap: wrap;
    }
    .cc-court {
        font-size: clamp(1.2rem, 2.4vw, 2.3rem);
        font-weight: 900; line-height: 1.2;
    }
    .cc-league {
        background: rgba(0,0,0,0.28);
        padding: 0.15em 0.7em; border-radius: 1em;
        font-size: clamp(0.75rem, 1.3vw, 1.2rem);
        font-weight: bold; white-space: nowrap;
    }
    .cc-no {
        margin-left: auto;
        font-size: clamp(0.75rem, 1.3vw, 1.2rem);
        font-weight: bold; opacity: 0.9; white-space: nowrap;
    }

    .cc-body {
        flex: 1; padding: clamp(0.7rem, 1.5vw, 1.6rem);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: clamp(0.35rem, 0.9vw, 0.9rem);
    }

    .team-box {
        width: 100%; background: #fff;
        border-radius: 0.45em;
        padding: clamp(0.5rem, 1.1vw, 1.1rem) 0.5rem;
        display: flex; flex-direction: column;
        align-items: center; gap: 0.1em;
    }
    .player {
        font-size: clamp(1.25rem, 3vw, 3.2rem);
        font-weight: 900; color: #1a202c;
        line-height: 1.25; text-align: center;
        word-break: break-all;
    }
    .vs {
        font-size: clamp(0.95rem, 1.8vw, 1.7rem);
        font-weight: 900; color: #e07b2a;
        letter-spacing: 0.06em;
    }

    .cc-foot {
        padding: 0.4em 0.8em;
        background: #222c3a;
        font-size: clamp(0.7rem, 1.15vw, 1.1rem);
        color: #a0aec0; text-align: center;
    }

    /* 全試合終了 */
    .cc-empty {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0.4em; padding: clamp(1.2rem, 3vw, 3rem) 1rem;
        color: #68d391;
    }
    .cc-empty .ic { font-size: clamp(1.8rem, 4vw, 4rem); line-height: 1; }
    .cc-empty .tx {
        font-size: clamp(1rem, 1.8vw, 1.8rem);
        font-weight: bold;
    }

    /* ===== ローディング / エラー / 空 ===== */
    .center-msg {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0.9em; padding: 2em; text-align: center;
        color: #9ca3af; font-size: clamp(0.9rem, 1.5vw, 1.4rem);
    }
    .spinner { display: flex; gap: 0.5em; }
    .spinner span {
        width: 0.7em; height: 0.7em; background: #6b7280;
        border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .spinner span:nth-child(2) { animation-delay: .2s; }
    .spinner span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
        0%,80%,100% { transform: scale(.6); opacity: .4; }
        40%          { transform: scale(1);  opacity: 1;  }
    }
    .err-box {
        background: #3e1010; border: 1px solid #c62828;
        border-radius: 0.55em; padding: 1em 1.4em;
        color: #ef9a9a; line-height: 1.7; max-width: 40em;
    }
    .retry-btn {
        padding: 0.55em 1.4em; background: #c62828; color: #fff;
        border: none; border-radius: 0.4em; cursor: pointer;
        font-size: inherit; font-weight: bold;
    }
</style>
</head>
<body>

<header>
    <h1 id="site-title">&#x1F3BE; 次の試合</h1>
    <div class="hd-right">
        <span class="updated" id="updated"></span>
        <button class="refresh-btn" onclick="load()">&#x1F504; 更新</button>
    </div>
</header>

<div id="board" style="display:none;"></div>

<div class="center-msg" id="loading">
    <div class="spinner"><span></span><span></span><span></span></div>
    読み込み中...
</div>

<div class="center-msg" id="error" style="display:none;">
    <div class="err-box" id="error-msg"></div>
    <button class="retry-btn" onclick="load()">再試行</button>
</div>

<script>
// ── 設定 ─────────────────────────────────────────────────────
const GAS_URL     = 'https://script.google.com/macros/s/AKfycbz6I7bh3eikmYlCO-GqgSvxGV9flTpyi9YawSISh_8ZjqKJpV_v9k6K71i0H7J6jJSH4A/exec';
const REFRESH_MS  = 30000; // 30秒ごとに自動更新
// ─────────────────────────────────────────────────────────────

let timer = null;

async function load() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (document.getElementById('board').style.display === 'none') showView('loading');

    try {
        const res  = await fetch(GAS_URL + '?action=getLeagues');
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (data.eventName) {
            document.getElementById('site-title').textContent =
                '\u{1F3BE} ' + data.eventName + '　次の試合';
        }

        const leagues = data.leagues || [];
        if (!leagues.length) {
            showError('リーグが登録されていません<br>基本設定シートを確認してください');
            return;
        }

        // 全リーグの試合をまとめて取得
        const lists = await Promise.all(leagues.map(async function(l) {
            const r = await fetch(GAS_URL + '?action=getMatches&league=' + encodeURIComponent(l.name));
            const m = await r.json();
            if (m.error) throw new Error(l.name + ': ' + m.error);
            return m.map(function(x) { x.league = l.name; return x; });
        }));

        render([].concat.apply([], lists));
        markUpdated();
    } catch (e) {
        showError('試合情報の取得に失敗しました<br>' + esc(e.message));
    } finally {
        timer = setTimeout(load, REFRESH_MS);
    }
}

function render(matches) {
    // コート別に集計（次の1試合＝未実施のうち最も番号が若い試合）
    const courts = {};
    for (const m of matches) {
        if (!m.team1.length || !m.team1[0] || !m.team2.length || !m.team2[0]) continue;
        const key = m.court || '-';
        if (!courts[key]) courts[key] = { next: null, remaining: 0 };
        if (m.done) continue;
        courts[key].remaining++;
        const cur = courts[key].next;
        if (!cur || m.no < cur.no || (m.no === cur.no && m.league < cur.league)) {
            courts[key].next = m;
        }
    }

    const keys = Object.keys(courts).sort();
    if (!keys.length) {
        showError('表示できる試合がありません<br>試合表シートを確認してください');
        return;
    }

    let html = '';
    for (const court of keys) {
        const c = courts[court];
        const m = c.next;

        if (!m) {
            html += '<div class="court-card">' +
                '<div class="cc-head"><span class="cc-court">' + esc(court) + 'コート</span></div>' +
                '<div class="cc-empty"><div class="ic">&#x2705;</div>' +
                '<div class="tx">全試合終了</div></div>' +
                '</div>';
            continue;
        }

        const t1 = m.team1.map(function(n) {
            return '<div class="player">' + esc(n) + '</div>';
        }).join('');
        const t2 = m.team2.map(function(n) {
            return '<div class="player">' + esc(n) + '</div>';
        }).join('');

        html += '<div class="court-card has-next">' +
            '<div class="cc-head">' +
                '<span class="cc-court">' + esc(court) + 'コート</span>' +
                '<span class="cc-league">' + esc(m.league) + '</span>' +
                '<span class="cc-no">第' + m.no + '試合</span>' +
            '</div>' +
            '<div class="cc-body">' +
                '<div class="team-box">' + t1 + '</div>' +
                '<div class="vs">vs</div>' +
                '<div class="team-box">' + t2 + '</div>' +
            '</div>' +
            '<div class="cc-foot">残り ' + c.remaining + ' 試合</div>' +
            '</div>';
    }

    document.getElementById('board').innerHTML = html;
    courtCount = keys.length;
    applyLayout();
    showView('board');
}

// コート数と画面幅に応じて列数を決め、カードを画面いっぱいに広げる
let courtCount = 0;
function applyLayout() {
    if (!courtCount) return;
    const w = window.innerWidth;
    let max;
    if      (w < 700)  max = 1;
    else if (w < 1100) max = 2;
    else if (w < 1700) max = 3;
    else               max = 4;

    let cols = Math.min(courtCount, max);
    // 4コートは 2x2 のほうが1枚あたりが大きくなる
    if (courtCount === 4 && cols > 2) cols = 2;
    document.getElementById('board').style.gridTemplateColumns =
        'repeat(' + Math.max(1, cols) + ', 1fr)';
}

window.addEventListener('resize', applyLayout);

function markUpdated() {
    const d = new Date();
    const p = function(n) { return ('0' + n).slice(-2); };
    document.getElementById('updated').innerHTML =
        '<span class="dot"></span>' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' 更新';
}

function showView(name) {
    document.getElementById('board').style.display   = (name === 'board')   ? 'grid' : 'none';
    document.getElementById('loading').style.display = (name === 'loading') ? 'flex' : 'none';
    document.getElementById('error').style.display   = (name === 'error')   ? 'flex' : 'none';
}

function showError(msg) {
    document.getElementById('error-msg').innerHTML = '&#x26A0;&#xFE0F; ' + msg;
    showView('error');
}

function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 画面を再表示したとき（タブ復帰など）は即時更新
document.addEventListener('visibilitychange', function() {
    if (!document.hidden) load();
});

load();
</script>
</body>
</html>
